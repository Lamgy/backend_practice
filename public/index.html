<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student API Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 30px;
    }
    h1 {
      margin-bottom: 10px;
    }
    section {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input, button {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
    }
    button {
      cursor: pointer;
    }
    pre {
      background: #111;
      color: #0f0;
      padding: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

<h1>Student API - Live Demo</h1>
<p>This page demonstrates backend functionality without Postman.</p>

<section>
  <h2>Add Student</h2>
  <input id="name" placeholder="Name" />
  <input id="age" type="number" placeholder="Age" />
  <input id="major" placeholder="Major" />
  <button onclick="addStudent()">Create Student</button>
</section>

<section>
  <h2>Get All Students</h2>
  <button onclick="getStudents()">Load Students</button>
</section>

<section>
  <h2>Get Student by ID</h2>
  <input id="studentId" placeholder="Student ID" />
  <button onclick="getStudentById()">Get Student</button>
</section>

<section>
  <h2>Update Student</h2>
  <input id="updateId" placeholder="Student ID" />
  <input id="updateName" placeholder="New Name" />
  <button onclick="updateStudent()">Update</button>
</section>

<section>
  <h2>Delete Student</h2>
  <input id="deleteId" placeholder="Student ID" />
  <button onclick="deleteStudent()">Delete</button>
</section>

<section>
  <h2>Average Age</h2>
  <button onclick="getAverageAge()">Calculate</button>
</section>

<section>
  <h2>API Response</h2>
  <pre id="output">Waiting for action...</pre>
</section>

<script>
  const API_URL = ""; 

  const output = document.getElementById("output");

  function show(data) {
    output.textContent = JSON.stringify(data, null, 2);
  }

  async function addStudent() {
    const res = await fetch(API_URL + "/api/students", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: name.value,
        age: Number(age.value),
        major: major.value
      })
    });
    show(await res.json());
  }

  async function getStudents() {
    const res = await fetch(API_URL + "/api/students");
    show(await res.json());
  }

  async function getStudentById() {
    const res = await fetch(API_URL + "/api/students/" + studentId.value);
    show(await res.json());
  }

  async function updateStudent() {
    const res = await fetch(API_URL + "/api/students/" + updateId.value, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: updateName.value })
    });
    show(await res.json());
  }

  async function deleteStudent() {
    const res = await fetch(API_URL + "/api/students/" + deleteId.value, {
      method: "DELETE"
    });
    show(await res.json());
  }

  async function getAverageAge() {
    const res = await fetch(API_URL + "/api/students/average-age");
    show(await res.json());
  }
</script>

</body>
</html>
